# Paste these into Streamlit Community Cloud: app settings > Secrets.
# (Locally, use .env instead. Never commit a real secrets.toml.)

GOOGLE_API_KEY = "your-gemini-key"
CHAT_MODEL = "google_genai:gemini-3.5-flash"
UTILITY_MODEL = "google_genai:gemini-3.5-flash-lite"   # separate free-tier quota from the chat model
EMBEDDING_MODEL = "google_genai:gemini-embedding-001"
MAX_CONCURRENCY = "2"

# Strongly recommended on the cloud: the disk there is wiped on every restart.
# Free Postgres: https://neon.tech (copy the connection string, keep ?sslmode=require)
POSTGRES_URI = "postgresql://user:password@host/dbname?sslmode=require"

# Keeps the app private if it is public: visitors must enter this password.
APP_PASSWORD = "choose-a-long-password"

# DuckDuckGo is usually blocked from cloud servers; Tavily has a free tier.
TAVILY_API_KEY = ""
